services:
  atenea-clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8}
    container_name: dev-clickhouse-atenea
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-atenea}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-atenea}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./_data/clickhouse:/var/lib/clickhouse
    ports:
      - "127.0.0.1:28123:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    networks:
      - atenea-db

  atenea-postgres:
    container_name: dev-postgres-atenea
    image: postgres:15-bookworm
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    command:
      - postgres
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-8}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-4}
    volumes:
      - ./_data/postgres:/data/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      # <Port exposed> : < PostgreSQL Port running inside container>
      - "25451:5432"
    expose:
      - "25451"
    networks:
      - atenea-db

  atenea-pgadmin:
    container_name: dev-pgadmin-atenea
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@gicp.es}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - _pgadmin:/root/.pgadmin
    ports:
      - "${PGADMIN_PORT:-25060}:80"
    networks:
      - atenea-db
    restart: unless-stopped

  redis:
    image: "redis:alpine"
    container_name: dev-redis-atenea
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "26000:6379"
    volumes:
      - ./redis/data:/var/lib/redis
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      node_net:
        aliases: 
          - dev-redis

  atenea-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dev-minio-atenea
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - ./_data/minio:/data
    networks:
      - atenea-db
      - node_net
    restart: unless-stopped

networks:
  atenea-db:
    driver: bridge
  node_net:
    ipam:
      driver: default
      config:
        - subnet: 172.20.9.0/24 # 172.16.9.X/24 for Atenea main project

volumes:
  _data: 
  _pgadmin: 
