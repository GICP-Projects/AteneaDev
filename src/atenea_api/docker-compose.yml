  atenea-beat:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-beat
    command: ["bash", "-c", "celery -A atenea_api beat -l INFO"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
    env_file:
      - ../../.env.prod

networks:
  atenea-network:
    driver: bridge
  atenea_services_net:
    external: true
    name: atenea_services_net

volumes:
  _pgadmin:
