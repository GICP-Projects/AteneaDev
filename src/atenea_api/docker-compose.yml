      - ../../.env.prod

  atenea-queue-ner-backfill:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-ner-backfill-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q ner-backfill-q -n AT7@%h -l INFO --concurrency=${QUEUE_NER_BACKFILL_CONCURRENCY:-1} --prefetch-multiplier=1"]
    depends_on:
