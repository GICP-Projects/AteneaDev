  atenea-queue-sentiment:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-sentiment-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q sentiment-q -n AT10@%h -l INFO --concurrency=${QUEUE_SENTIMENT_CONCURRENCY:-1} --prefetch-multiplier=1"]
    depends_on:
