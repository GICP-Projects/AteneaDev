        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
      - atenea_services_net
    env_file:
      - ../../.env.prod

  atenea-queue-ner-store:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-ner-store-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q ner-store-q -n AT8@%h -l INFO --concurrency=${QUEUE_NER_STORE_CONCURRENCY:-1} --prefetch-multiplier=1"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
      - atenea_services_net
    env_file:
      - ../../.env.prod

  atenea-queue-embed:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-embed-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q embed-q -n AT9@%h -l INFO --concurrency=${QUEUE_EMBED_CONCURRENCY:-1} --prefetch-multiplier=1"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
      - atenea_services_net
