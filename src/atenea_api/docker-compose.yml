services:
  atenea-clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8}
    container_name: prod-clickhouse-atenea
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-atenea}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-atenea}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./_prod_data/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    networks:
      - atenea-network

  atenea-postgres:
    container_name: prod-postgres-atenea
    image: postgres:15-bookworm
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    command:
      - postgres
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-8}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-4}
    volumes:
      - ./_prod_data/postgres:/data/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - atenea-network

  atenea-pgadmin:
    container_name: prod-pgadmin-atenea
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - _pgadmin:/root/.pgadmin
    ports:
      - "25061:80" # Expose only necessary port
    networks:
      - atenea-network
    restart: unless-stopped

  atenea-backend:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-backend-atenea
    command: sh -c "python manage.py migrate &&
                    python manage.py init_clickhouse &&
                    exec gunicorn atenea_api.wsgi:application --worker-class gevent --workers 10 --timeout 300 --log-level debug --bind 0.0.0.0:8000"
    ports:
      - "28111:8000" # Expose only necessary port
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 30s
    networks:
      - atenea-network
      - atenea_services_net
    env_file:
      - ../../.env.prod
    depends_on:
      atenea-postgres:
        condition: service_healthy
      atenea-clickhouse:
        condition: service_healthy

  atenea-redis:
    image: "redis:alpine"
    container_name: prod-redis-atenea
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis/data:/var/lib/redis
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_REPLICATION_MODE=master
    depends_on:
      - atenea-backend
    networks:
      - atenea-network

  atenea-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: prod-minio-atenea
    command: server /data --console-address ":9001"
    ports:
      - "29111:9000"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./_prod_data/minio:/data
    networks:
      - atenea-network
    restart: unless-stopped

  atenea-queue-default:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-default-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q default -n AT1@%h -l INFO --concurrency=${QUEUE_DEFAULT_CONCURRENCY:-4}"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
      - atenea_services_net
    env_file:
      - ../../.env.prod

  atenea-queue-index:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-index-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q index-q -n AT2@%h -l INFO --concurrency=${QUEUE_INDEX_CONCURRENCY:-1}"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
    env_file:
      - ../../.env.prod

  atenea-queue-telegram-scan:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-telegram-scan-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q telegram-scan-q -n AT3@%h -l INFO --concurrency=${QUEUE_TELEGRAM_SCAN_CONCURRENCY:-1} --prefetch-multiplier=1"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
    env_file:
      - ../../.env.prod

  atenea-queue-telegram-scan-comments:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-telegram-scan-comments-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q telegram-scan-comments-q -n AT4@%h -l INFO --concurrency=${QUEUE_TELEGRAM_SCAN_COMMENTS_CONCURRENCY:-1} --prefetch-multiplier=1"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
    env_file:
      - ../../.env.prod

  atenea-queue-telegram-populate:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-telegram-populate-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q telegram-populate-q -n AT5@%h -l INFO --concurrency=${QUEUE_TELEGRAM_POPULATE_CONCURRENCY:-1} --prefetch-multiplier=1"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
      - atenea-network
    env_file:
      - ../../.env.prod

  # Durable stages transfer Batch UUIDs only.
  atenea-queue-ner-live:
    image: ghcr.io/srfonso/atenea-api:${ATENEA_VERSION:?Set ATENEA_VERSION}
    container_name: prod-ner-live-queue-atenea
    command: ["bash", "-c", "celery -A atenea_api worker -Q ner-live-q -n AT6@%h -l INFO --concurrency=${QUEUE_NER_LIVE_CONCURRENCY:-1} --prefetch-multiplier=1"]
    depends_on:
      atenea-redis:
        condition: service_started
      atenea-backend:
        condition: service_healthy
    networks:
