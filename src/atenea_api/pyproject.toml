[project]
name = "atenea-api"
version = "0.11.1"
description = "Django REST API for the Atenea Telegram monitoring platform"
requires-python = ">=3.11.9,<3.12"
dependencies = [
    "aiohttp==3.8.6",
    "babel==2.15.0",
    "beautifulsoup4==4.12.2",
    "boto3==1.43.11",
    "celery==5.3.6",
    "django==4.2.13",
    "django-celery-beat==2.6.0",
    "django-cors-headers==3.14.0",
    "django-elasticsearch-dsl==8.2",
    # The unchanged DRF fork still depends on the legacy DSL compatibility package.
    "django-elasticsearch-dsl-drf",
    "django-oauth-toolkit==3.0.1",
    "django-phonenumber-field[phonenumberslite]==8.0.0",
    "djangorestframework==3.15.1",
    "djangorestframework-api-key==3.0.0",
    "drf-social-oauth2==3.1.0",
    "drf-spectacular==0.27.2",
    "eld==1.0.6",
    "elasticsearch==8.19.3",
    "emoji==2.8.0",
    "gevent==24.11.1",
    "geoip2==4.6.0",
    "gunicorn==23.0.0",
    "markdown==3.5.1",
    "numpy==2.3.3",
    "openai==1.82.0",
    "pydantic==2.13.4",
    "psycopg2-binary==2.9.9",
    "python-dateutil==2.8.2",
    "python-dotenv==1.0.0",
    "qdrant-client==1.17.1",
    "redis==4.6.0",
    "telethon==1.36.0",
    "clickhouse-connect>=0.9,<2",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}"
build_command = """
python -m pip install --quiet uv==0.11.26
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "^master$"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.uv.sources]
django-elasticsearch-dsl-drf = { git = "https://github.com/srfonso/django-elasticsearch-dsl-drf" }

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "pytest-django==4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "atenea_api.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = [
    "app_base",
    "app_dashboard",
    "app_entity",
    "app_frontend",
    "app_metadata",
    "app_scheduler",
    "app_stats",
    "app_telegram",
]
addopts = "-ra --strict-markers --reuse-db"
filterwarnings = [
    # The pinned django-elasticsearch-dsl-drf fork still imports
    # distutils.version.LooseVersion on Python 3.11. Keep this suppression scoped
    # to that dependency until the fork migrates to packaging.version.Version.
    "ignore:The distutils package is deprecated.*:DeprecationWarning:django_elasticsearch_dsl_drf\\.versions",
]
markers = [
    "integration: tests that use PostgreSQL while keeping external services mocked",
    "clickhouse: tests requiring the isolated ClickHouse service and --clickhouse",
]

[tool.coverage.run]
branch = true
source = [
    "app_base",
    "app_dashboard",
    "app_entity",
    "app_frontend",
    "app_metadata",
    "app_scheduler",
    "app_stats",
    "app_telegram",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
